# SRAM macro DRC flattening helpers from the official template
MAGIC_GDS_FLATGLOB:
  - "lvsres_*"
  - "VIA_M1_*"
  - "VIA_M2_*"
  - "*_CELL_CORNER"
  - "RSC_*"
  - "*_CELL_SUB"

# Start permissive for bring-up; tighten these for tapeout signoff.
ERROR_ON_TIMING_VIOLATIONS: false
ERROR_ON_LVS_ERROR: false
ERROR_ON_DRC_ERROR: false
ERROR_ON_ANTENNA_ERROR: false
